#
# Managed component dependencies for the firmware application.

dependencies:
  # TinyUSB, used only by the native USB Bluetooth (BTH class) HCI transport on
  # the ESP32-S3 (the one target with a USB-OTG controller). Pulled only for that
  # target; it is linked only when CONFIG_UNCHAINED_HCI_OVER_USB_BTH selects it.
  espressif/esp_tinyusb:
    version: ">=1.7.0"
    rules:
      - if: "target == esp32s3"

  # RMT addressable-LED driver for the status LEDs. Always pulled (main requires
  # it unconditionally, like esp_lcd); linked only when CONFIG_UNCHAINED_LED_ENABLED
  # selects status/status_led.c.
  espressif/led_strip:
    version: "^3"
