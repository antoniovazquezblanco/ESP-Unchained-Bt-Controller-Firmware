name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }} - ${{ matrix.board || 'no board' }})
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    env:
      BOARD: ${{ matrix.board }}
      TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { board: "",                 target: esp32c5 }
          - { board: "",                 target: esp32c3 }
          - { board: "",                 target: esp32 }
          - { board: scapycon2026badge,  target: esp32c5 }
          - { board: esp32c3supermini,   target: esp32c3 }
          - { board: esp32devkitc,       target: esp32 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        shell: bash
        run: |
          # The checkout is owned by a different user than the container runs as.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # The boot-logo header is generated at build time from utils/logo, so
          # install Pillow into ESP-IDF's Python (the one the build invokes).
          . "$IDF_PATH/export.sh"
          pip install --quiet pillow

      - name: Configure
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py ${BOARD:+-DBOARD=$BOARD} set-target "$TARGET"

      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py ${BOARD:+-DBOARD=$BOARD} build

      - name: Distribution
        if: success() && matrix.board != ''
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cmake --build build --target distribution

      - name: Upload distribution
        if: success() && matrix.board != ''
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.board }}
          if-no-files-found: error
          path: build/dist/*.zip
